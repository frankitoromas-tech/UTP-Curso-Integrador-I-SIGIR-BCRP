<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" style="background:#0F172A; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="uc-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Banner Superior -->
  <rect x="20" y="12" width="1060" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="38" fill="#38BDF8" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">
    DIAGRAMA DE CASOS DE USO (UML 2.5) — SISTEMA SIGIR-BCRP
  </text>

  <!-- Límite del Sistema -->
  <rect x="260" y="65" width="580" height="475" rx="12" fill="#131D33" stroke="#2563EB" stroke-width="2" filter="url(#uc-shadow)"/>
  <rect x="260" y="65" width="580" height="32" rx="8" fill="#1E3A8A"/>
  <text x="550" y="86" fill="#DBEAFE" font-size="12" font-weight="bold" text-anchor="middle">
    LÍMITE DEL SISTEMA: SUBSISTEMA GESTIÓN DE INCIDENTES Y REGULACIÓN (SIGIR-BCRP)
  </text>

  <!-- ACTORES IZQUIERDA -->
  <!-- Operador NOC -->
  <circle cx="120" cy="160" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="120" cy="152" r="9" fill="#38BDF8"/>
  <path d="M 105 174 A 15 15 0 0 1 135 174" fill="#38BDF8"/>
  <text x="120" y="202" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle">Operador NOC</text>
  <text x="120" y="217" fill="#94A3B8" font-size="10" text-anchor="middle">(Entidad Financiera)</text>

  <!-- Worker Telemetría -->
  <circle cx="120" cy="380" r="22" fill="#1E293B" stroke="#C084FC" stroke-width="2.5"/>
  <rect x="108" y="368" width="24" height="24" rx="4" fill="#A855F7"/>
  <circle cx="115" cy="378" r="3" fill="#FFFFFF"/>
  <circle cx="125" cy="378" r="3" fill="#FFFFFF"/>
  <line x1="114" y1="386" x2="126" y2="386" stroke="#FFFFFF" stroke-width="2"/>
  <text x="120" y="422" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle">Worker Telemetría</text>
  <text x="120" y="437" fill="#C4B5FD" font-size="10" text-anchor="middle">(Daemon Asíncrono)</text>

  <!-- ACTORES DERECHA -->
  <!-- Supervisor BCRP -->
  <circle cx="980" cy="160" r="22" fill="#1E293B" stroke="#34D399" stroke-width="2.5"/>
  <circle cx="980" cy="152" r="9" fill="#34D399"/>
  <path d="M 965 174 A 15 15 0 0 1 995 174" fill="#34D399"/>
  <text x="980" y="202" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle">Supervisor BCRP</text>
  <text x="980" y="217" fill="#A7F3D0" font-size="10" text-anchor="middle">(Mesa Regulatoria)</text>

  <!-- Administrador TI -->
  <circle cx="980" cy="380" r="22" fill="#1E293B" stroke="#FBBF24" stroke-width="2.5"/>
  <circle cx="980" cy="372" r="9" fill="#FBBF24"/>
  <path d="M 965 394 A 15 15 0 0 1 995 394" fill="#FBBF24"/>
  <text x="980" y="422" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle">Administrador TI</text>
  <text x="980" y="437" fill="#FDE68A" font-size="10" text-anchor="middle">(Auditoría / Sistema)</text>

  <!-- CASOS DE USO (ELIPSES) -->
  <!-- UC-01 -->
  <ellipse cx="400" cy="130" rx="115" ry="24" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="400" y="134" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">UC-01: Registro Manual Asistido</text>

  <!-- UC-02 -->
  <ellipse cx="400" cy="200" rx="115" ry="24" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="400" y="204" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">UC-02: Monitoreo Tablero NOC</text>

  <!-- UC-03 -->
  <ellipse cx="400" cy="270" rx="115" ry="24" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="400" y="274" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">UC-03: Actualizar Estado Incidente</text>

  <!-- UC-06 -->
  <ellipse cx="400" cy="360" rx="115" ry="24" fill="#311042" stroke="#A855F7" stroke-width="2"/>
  <text x="400" y="364" fill="#F3E8FF" font-size="11" font-weight="bold" text-anchor="middle">UC-06: Polling Health Check</text>

  <!-- UC-07 -->
  <ellipse cx="400" cy="430" rx="115" ry="24" fill="#311042" stroke="#A855F7" stroke-width="2"/>
  <text x="400" y="434" fill="#F3E8FF" font-size="11" font-weight="bold" text-anchor="middle">UC-07: Auto-Disparo de Ticket</text>

  <!-- UC-04 -->
  <ellipse cx="700" cy="140" rx="115" ry="24" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="700" y="144" fill="#ECFDF5" font-size="11" font-weight="bold" text-anchor="middle">UC-04: Transmitir Archivo SFT</text>

  <!-- UC-08 -->
  <ellipse cx="700" cy="220" rx="115" ry="24" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="700" y="224" fill="#ECFDF5" font-size="11" font-weight="bold" text-anchor="middle">UC-08: Verificar Hash SHA-256</text>

  <!-- UC-05 -->
  <ellipse cx="700" cy="350" rx="115" ry="24" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="700" y="354" fill="#FEF3C7" font-size="11" font-weight="bold" text-anchor="middle">UC-05: Autenticar Active Directory</text>

  <!-- UC-09 -->
  <ellipse cx="700" cy="440" rx="115" ry="24" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="700" y="444" fill="#FEF3C7" font-size="11" font-weight="bold" text-anchor="middle">UC-09: Configurar Umbrales Telemetría</text>

  <!-- LÍNEAS DE ASOCIACIÓN -->
  <!-- Operador -> UCs -->
  <line x1="145" y1="160" x2="285" y2="130" stroke="#38BDF8" stroke-width="1.8"/>
  <line x1="145" y1="160" x2="285" y2="200" stroke="#38BDF8" stroke-width="1.8"/>
  <line x1="145" y1="160" x2="285" y2="270" stroke="#38BDF8" stroke-width="1.8"/>

  <!-- Worker -> UCs -->
  <line x1="145" y1="380" x2="285" y2="360" stroke="#C084FC" stroke-width="1.8"/>
  <line x1="145" y1="380" x2="285" y2="430" stroke="#C084FC" stroke-width="1.8"/>

  <!-- Supervisor -> UCs -->
  <line x1="955" y1="160" x2="815" y2="140" stroke="#34D399" stroke-width="1.8"/>
  <line x1="955" y1="160" x2="815" y2="220" stroke="#34D399" stroke-width="1.8"/>

  <!-- Admin TI -> UCs -->
  <line x1="955" y1="380" x2="815" y2="350" stroke="#FBBF24" stroke-width="1.8"/>
  <line x1="955" y1="380" x2="815" y2="440" stroke="#FBBF24" stroke-width="1.8"/>

  <!-- INCLUDES INTERNOS -->
  <!-- UC-01 include UC-05 -->
  <path d="M 515 130 L 600 130 L 600 350 L 585 350" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="590" y="240" fill="#94A3B8" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-04 include UC-08 -->
  <line x1="700" y1="164" x2="700" y2="196" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="705" y="184" fill="#94A3B8" font-size="9" font-style="italic">&lt;&lt;include&gt;&gt;</text>
</svg>