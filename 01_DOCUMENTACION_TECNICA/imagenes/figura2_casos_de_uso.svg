<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 580" width="1260" height="580" style="background:#0F172A; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="uc-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Banner Superior -->
  <rect x="20" y="12" width="1220" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="630" y="39" fill="#38BDF8" font-size="19" font-weight="bold" text-anchor="middle" letter-spacing="1">
    DIAGRAMA DE CASOS DE USO (UML 2.5) — SISTEMA SIGIR-BCRP
  </text>

  <!-- Límite del Sistema -->
  <rect x="240" y="68" width="780" height="485" rx="12" fill="#131D33" stroke="#2563EB" stroke-width="2.2" filter="url(#uc-shadow)"/>
  <rect x="240" y="68" width="780" height="34" rx="8" fill="#1E3A8A"/>
  <text x="630" y="91" fill="#DBEAFE" font-size="15" font-weight="bold" text-anchor="middle">
    LÍMITE DEL SISTEMA: SUBSISTEMA GESTIÓN DE INCIDENTES Y REGULACIÓN (SIGIR-BCRP)
  </text>

  <!-- ACTORES IZQUIERDA -->
  <!-- Operador NOC -->
  <circle cx="120" cy="180" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="120" cy="171" r="10" fill="#38BDF8"/>
  <path d="M 104 195 A 16 16 0 0 1 136 195" fill="#38BDF8"/>
  <text x="120" y="226" fill="#F8FAFC" font-size="16" font-weight="bold" text-anchor="middle">Operador NOC</text>
  <text x="120" y="244" fill="#BAE6FD" font-size="13" font-weight="bold" text-anchor="middle">(Entidad Financiera)</text>

  <!-- Worker Telemetría -->
  <circle cx="120" cy="400" r="24" fill="#1E293B" stroke="#C084FC" stroke-width="2.5"/>
  <rect x="106" y="386" width="28" height="28" rx="5" fill="#A855F7"/>
  <circle cx="114" cy="397" r="3.5" fill="#FFFFFF"/>
  <circle cx="126" cy="397" r="3.5" fill="#FFFFFF"/>
  <line x1="113" y1="406" x2="127" y2="406" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="120" y="446" fill="#F8FAFC" font-size="16" font-weight="bold" text-anchor="middle">Worker Telemetría</text>
  <text x="120" y="464" fill="#DDD6FE" font-size="13" font-weight="bold" text-anchor="middle">(Daemon Asíncrono)</text>

  <!-- ACTORES DERECHA -->
  <!-- Supervisor BCRP -->
  <circle cx="1140" cy="180" r="24" fill="#1E293B" stroke="#34D399" stroke-width="2.5"/>
  <circle cx="1140" cy="171" r="10" fill="#34D399"/>
  <path d="M 1124 195 A 16 16 0 0 1 1156 195" fill="#34D399"/>
  <text x="1140" y="226" fill="#F8FAFC" font-size="16" font-weight="bold" text-anchor="middle">Supervisor BCRP</text>
  <text x="1140" y="244" fill="#A7F3D0" font-size="13" font-weight="bold" text-anchor="middle">(Mesa Regulatoria)</text>

  <!-- Administrador TI -->
  <circle cx="1140" cy="400" r="24" fill="#1E293B" stroke="#FBBF24" stroke-width="2.5"/>
  <circle cx="1140" cy="391" r="10" fill="#FBBF24"/>
  <path d="M 1124 415 A 16 16 0 0 1 1156 415" fill="#FBBF24"/>
  <text x="1140" y="446" fill="#F8FAFC" font-size="16" font-weight="bold" text-anchor="middle">Administrador TI</text>
  <text x="1140" y="464" fill="#FDE68A" font-size="13" font-weight="bold" text-anchor="middle">(Auditoría / Sistema)</text>

  <!-- CASOS DE USO COLUMNA IZQUIERDA (cx=420, rx=135) -->
  <!-- UC-01 -->
  <ellipse cx="420" cy="140" rx="135" ry="26" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="420" y="145" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">UC-01: Registro Manual Asistido</text>

  <!-- UC-02 -->
  <ellipse cx="420" cy="215" rx="135" ry="26" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="420" y="220" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">UC-02: Monitoreo Tablero NOC</text>

  <!-- UC-03 -->
  <ellipse cx="420" cy="290" rx="135" ry="26" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <text x="420" y="295" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle">UC-03: Actualizar Estado Incidente</text>

  <!-- UC-06 -->
  <ellipse cx="420" cy="380" rx="135" ry="26" fill="#311042" stroke="#A855F7" stroke-width="2"/>
  <text x="420" y="385" fill="#F3E8FF" font-size="14" font-weight="bold" text-anchor="middle">UC-06: Polling Health Check</text>

  <!-- UC-07 -->
  <ellipse cx="420" cy="455" rx="135" ry="26" fill="#311042" stroke="#A855F7" stroke-width="2"/>
  <text x="420" y="460" fill="#F3E8FF" font-size="14" font-weight="bold" text-anchor="middle">UC-07: Auto-Disparo de Ticket</text>

  <!-- CASOS DE USO COLUMNA DERECHA (cx=840, rx=135) -->
  <!-- UC-04 -->
  <ellipse cx="840" cy="150" rx="135" ry="26" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="840" y="155" fill="#ECFDF5" font-size="14" font-weight="bold" text-anchor="middle">UC-04: Transmitir Archivo SFT</text>

  <!-- UC-08 -->
  <ellipse cx="840" cy="235" rx="135" ry="26" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="840" y="240" fill="#ECFDF5" font-size="14" font-weight="bold" text-anchor="middle">UC-08: Verificar Hash SHA-256</text>

  <!-- UC-05 -->
  <ellipse cx="840" cy="365" rx="135" ry="26" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="840" y="370" fill="#FEF3C7" font-size="14" font-weight="bold" text-anchor="middle">UC-05: Autenticar Active Directory</text>

  <!-- UC-09 -->
  <ellipse cx="840" cy="455" rx="135" ry="26" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
  <text x="840" y="460" fill="#FEF3C7" font-size="14" font-weight="bold" text-anchor="middle">UC-09: Configurar Umbrales Telemetría</text>

  <!-- LÍNEAS DE ASOCIACIÓN -->
  <!-- Operador -> UCs -->
  <line x1="150" y1="180" x2="285" y2="140" stroke="#38BDF8" stroke-width="2"/>
  <line x1="150" y1="180" x2="285" y2="215" stroke="#38BDF8" stroke-width="2"/>
  <line x1="150" y1="180" x2="285" y2="290" stroke="#38BDF8" stroke-width="2"/>

  <!-- Worker -> UCs -->
  <line x1="150" y1="400" x2="285" y2="380" stroke="#C084FC" stroke-width="2"/>
  <line x1="150" y1="400" x2="285" y2="455" stroke="#C084FC" stroke-width="2"/>

  <!-- Supervisor -> UCs -->
  <line x1="1110" y1="180" x2="975" y2="150" stroke="#34D399" stroke-width="2"/>
  <line x1="1110" y1="180" x2="975" y2="235" stroke="#34D399" stroke-width="2"/>

  <!-- Admin TI -> UCs -->
  <line x1="1110" y1="400" x2="975" y2="365" stroke="#FBBF24" stroke-width="2"/>
  <line x1="1110" y1="400" x2="975" y2="455" stroke="#FBBF24" stroke-width="2"/>

  <!-- INCLUDES INTERNOS (CORREDOR CENTRAL LIMPIO EN X=630) -->
  <!-- UC-01 include UC-05 -->
  <path d="M 555 140 L 630 140 L 630 365 L 705 365" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="630" y="255" fill="#94A3B8" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-04 include UC-08 -->
  <line x1="840" y1="176" x2="840" y2="209" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="850" y="197" fill="#94A3B8" font-size="13" font-weight="bold" font-style="italic">&lt;&lt;include&gt;&gt;</text>
</svg>