<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" style="background:#0F172A; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <rect x="20" y="12" width="1060" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="38" fill="#38BDF8" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">
    DIAGRAMA DE SECUENCIA: REGISTRO MANUAL ASISTIDO CON ACTIVE DIRECTORY (LDAPS 636)
  </text>

  <!-- Participantes -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="150" height="45" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="75" y="27" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">Operador NOC</text>
    <line x1="75" y1="45" x2="75" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(240, 70)">
    <rect x="0" y="0" width="150" height="45" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="75" y="27" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">Frontend NOC</text>
    <line x1="75" y1="45" x2="75" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(440, 70)">
    <rect x="0" y="0" width="160" height="45" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="80" y="27" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">Active Directory (AD)</text>
    <line x1="80" y1="45" x2="80" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(660, 70)">
    <rect x="0" y="0" width="160" height="45" rx="8" fill="#581C87" stroke="#A855F7" stroke-width="1.5"/>
    <text x="80" y="27" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">Backend SIGIR</text>
    <line x1="80" y1="45" x2="80" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(880, 70)">
    <rect x="0" y="0" width="160" height="45" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.5"/>
    <text x="80" y="27" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL 15</text>
    <line x1="80" y1="45" x2="80" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Flujo -->
  <line x1="115" y1="145" x2="310" y2="145" stroke="#38BDF8" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="212" y="137" fill="#E2E8F0" font-size="11" text-anchor="middle">1. Ingresa credenciales corporativas</text>

  <line x1="315" y1="180" x2="515" y2="180" stroke="#FBBF24" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="415" y="172" fill="#FEF3C7" font-size="11" text-anchor="middle">2. POST /auth/login (LDAPS puerto 636)</text>

  <line x1="520" y1="215" x2="320" y2="215" stroke="#34D399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#m-green)"/>
  <text x="415" y="207" fill="#A7F3D0" font-size="11" text-anchor="middle">3. Autenticación OK + JWT Token (Rol OPERADOR_NOC)</text>

  <line x1="115" y1="250" x2="310" y2="250" stroke="#38BDF8" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="212" y="242" fill="#E2E8F0" font-size="11" text-anchor="middle">4. Registra Incidente en Formulario Asistido</text>

  <line x1="315" y1="285" x2="735" y2="285" stroke="#38BDF8" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="525" y="277" fill="#E2E8F0" font-size="11" text-anchor="middle">5. POST /api/v1/incidentes [Bearer JWT]</text>

  <line x1="740" y1="320" x2="955" y2="320" stroke="#34D399" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="847" y="312" fill="#E2E8F0" font-size="11" text-anchor="middle">6. Validar Regla RN-01 + INSERT</text>

  <line x1="740" y1="360" x2="320" y2="360" stroke="#34D399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#m-green)"/>
  <text x="530" y="352" fill="#A7F3D0" font-size="11" text-anchor="middle">7. HTTP 201 Created (Ticket: 'INC-20260904-002')</text>

  <rect x="50" y="380" width="180" height="40" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="140" y="405" fill="#D1FAE5" font-size="11" font-weight="bold" text-anchor="middle">Ticket Generado y Activo</text>
</svg>