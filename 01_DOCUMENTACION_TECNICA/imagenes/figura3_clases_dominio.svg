<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" style="background:#0F172A; font-family:'Consolas', 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="cls-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Banner Superior -->
  <rect x="20" y="12" width="1060" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="38" fill="#38BDF8" font-family="'Segoe UI', Arial" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">
    DIAGRAMA DE CLASES DEL DOMINIO — MODELO DE NEGOCIO SIGIR-BCRP
  </text>

  <!-- CLASE 1: EntidadFinanciera -->
  <g transform="translate(30, 75)" filter="url(#cls-shadow)">
    <rect x="0" y="0" width="280" height="360" rx="8" fill="#131D33" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="6" fill="#1E3A8A"/>
    <text x="140" y="23" fill="#DBEAFE" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" text-anchor="middle">EntidadFinanciera</text>
    
    <!-- Atributos -->
    <text x="15" y="60" fill="#93C5FD" font-size="11">- id: Long</text>
    <text x="15" y="80" fill="#93C5FD" font-size="11">- ruc: String</text>
    <text x="15" y="100" fill="#93C5FD" font-size="11">- razonSocial: String</text>
    <text x="15" y="120" fill="#93C5FD" font-size="11">- codigoBcrp: String</text>
    <text x="15" y="140" fill="#93C5FD" font-size="11">- tipo: TipoEntidad</text>
    <text x="15" y="160" fill="#93C5FD" font-size="11">- estadoSemaforo: Semaforo</text>
    <text x="15" y="180" fill="#93C5FD" font-size="11">- endpointSalud: String</text>
    <text x="15" y="200" fill="#93C5FD" font-size="11">- activo: Boolean</text>
    
    <line x1="0" y1="215" x2="280" y2="215" stroke="#2563EB" stroke-width="1.5"/>
    <!-- Métodos -->
    <text x="15" y="240" fill="#E2E8F0" font-size="11">+ actualizarSemaforo(s: Semaforo)</text>
    <text x="15" y="260" fill="#E2E8F0" font-size="11">+ estaOperativa(): Boolean</text>
    <text x="15" y="280" fill="#E2E8F0" font-size="11">+ getIncidentes(): List&lt;Incidente&gt;</text>
  </g>

  <!-- Relación 1:* entre EntidadFinanciera e Incidente -->
  <line x1="310" y1="210" x2="380" y2="210" stroke="#38BDF8" stroke-width="2"/>
  <text x="320" y="200" fill="#38BDF8" font-size="12" font-weight="bold">1</text>
  <text x="365" y="200" fill="#38BDF8" font-size="12" font-weight="bold">0..*</text>

  <!-- CLASE 2: Incidente (Agregado Principal) -->
  <g transform="translate(380, 75)" filter="url(#cls-shadow)">
    <rect x="0" y="0" width="320" height="380" rx="8" fill="#17112E" stroke="#7C3AED" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="35" rx="6" fill="#581C87"/>
    <text x="160" y="23" fill="#F3E8FF" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" text-anchor="middle">Incidente (Root Aggregate)</text>
    
    <!-- Atributos -->
    <text x="15" y="55" fill="#C4B5FD" font-size="11">- id: Long</text>
    <text x="15" y="73" fill="#C4B5FD" font-size="11">- ticketNumero: String</text>
    <text x="15" y="91" fill="#C4B5FD" font-size="11">- entidad: EntidadFinanciera</text>
    <text x="15" y="109" fill="#C4B5FD" font-size="11">- categoria: CategoriaIncidente</text>
    <text x="15" y="127" fill="#C4B5FD" font-size="11">- estado: EstadoIncidente</text>
    <text x="15" y="145" fill="#C4B5FD" font-size="11">- severidad: SeveridadIncidente</text>
    <text x="15" y="163" fill="#C4B5FD" font-size="11">- descripcion: String</text>
    <text x="15" y="181" fill="#C4B5FD" font-size="11">- fechaInicio: Instant</text>
    <text x="15" y="199" fill="#C4B5FD" font-size="11">- fechaSolucion: Instant</text>
    <text x="15" y="217" fill="#C4B5FD" font-size="11">- operadorReporta: String</text>
    
    <line x1="0" y1="230" x2="320" y2="230" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- Métodos -->
    <text x="15" y="252" fill="#E2E8F0" font-size="11">+ transicionarEstado(nuevo, user, motivo)</text>
    <text x="15" y="272" fill="#E2E8F0" font-size="11">+ resolver(fechaSolucion: Instant)</text>
    <text x="15" y="292" fill="#E2E8F0" font-size="11">+ cerrarRegulatoriamente(): ReporteSft</text>
    <text x="15" y="312" fill="#E2E8F0" font-size="11">+ getDuracionMinutos(): Long</text>
    <text x="15" y="332" fill="#E2E8F0" font-size="11">+ getHistorial(): List&lt;HistorialEstado&gt;</text>
  </g>

  <!-- Relación 1:* entre Incidente e HistorialEstado -->
  <line x1="700" y1="180" x2="760" y2="180" stroke="#C084FC" stroke-width="2"/>
  <text x="708" y="172" fill="#C084FC" font-size="12" font-weight="bold">1</text>
  <text x="745" y="172" fill="#C084FC" font-size="12" font-weight="bold">1..*</text>

  <!-- CLASE 3: HistorialEstado (Append-Only) -->
  <g transform="translate(760, 75)" filter="url(#cls-shadow)">
    <rect x="0" y="0" width="310" height="210" rx="8" fill="#0B231A" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="35" rx="6" fill="#065F46"/>
    <text x="155" y="23" fill="#D1FAE5" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" text-anchor="middle">HistorialEstado (Append-Only)</text>
    
    <text x="15" y="55" fill="#86EFAC" font-size="11">- id: Long</text>
    <text x="15" y="73" fill="#86EFAC" font-size="11">- incidente: Incidente</text>
    <text x="15" y="91" fill="#86EFAC" font-size="11">- estadoAnterior: EstadoIncidente</text>
    <text x="15" y="109" fill="#86EFAC" font-size="11">- estadoNuevo: EstadoIncidente</text>
    <text x="15" y="127" fill="#86EFAC" font-size="11">- cambiadoPor: String</text>
    <text x="15" y="145" fill="#86EFAC" font-size="11">- motivo: String</text>
    <text x="15" y="163" fill="#86EFAC" font-size="11">- cambiadoEn: Instant</text>
    
    <line x1="0" y1="175" x2="310" y2="175" stroke="#059669" stroke-width="1.5"/>
    <text x="15" y="195" fill="#E2E8F0" font-size="10" font-style="italic">Trigger DB: UPDATE/DELETE Denied</text>
  </g>

  <!-- CLASE 4: ReporteSft (Homologación Normativa) -->
  <g transform="translate(760, 305)" filter="url(#cls-shadow)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#24170A" stroke="#D97706" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="30" rx="6" fill="#78350F"/>
    <text x="155" y="21" fill="#FEF3C7" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" text-anchor="middle">ReporteSft (Norma BCRP)</text>
    
    <text x="15" y="50" fill="#FDE68A" font-size="11">- id: Long</text>
    <text x="15" y="68" fill="#FDE68A" font-size="11">- nombreArchivo: String</text>
    <text x="15" y="86" fill="#FDE68A" font-size="11">- hashSha256: String</text>
    <text x="15" y="104" fill="#FDE68A" font-size="11">- generadoEn: Instant</text>
    <text x="15" y="122" fill="#FDE68A" font-size="11">- estadoEnvio: String</text>
  </g>

  <!-- Relación Incidente -> ReporteSft -->
  <path d="M 700 380 L 760 380" fill="none" stroke="#FBBF24" stroke-width="2"/>
  <text x="708" y="372" fill="#FBBF24" font-size="12" font-weight="bold">1</text>
  <text x="745" y="372" fill="#FBBF24" font-size="12" font-weight="bold">0..1</text>
</svg>